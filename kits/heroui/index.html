  .app-navbar .navbar-end{ gap:14px; }

  .hamburger-btn{ display:none; color:#fff !important; }
  .brand-wrap{ display:flex; align-items:center; gap:10px; flex-shrink:0; }

  .header-icon-btn{ color:#fff !important; position:relative; }

  .header-user{ display:flex; align-items:center; gap:10px; }
  .header-user-text{ line-height:1.2; }
  .header-user .u-name{ font-size:13px; font-weight:600; color:#fff; }

  @media (max-width:959px){

    .header-search{ display:none; }

      box-shadow:0 8px 28px rgba(0,0,0,.30);
      overflow-y:auto;
    }
    .app-sider.open{ transform:translateX(0); }

    .sider-backdrop{
      display:block; position:fixed; top:64px; left:0; right:0; bottom:0;
      background:rgba(0,0,0,.4); z-index:205;
      opacity:0; pointer-events:none; transition:opacity .18s ease;
    }
    .sider-backdrop.show{ opacity:1; pointer-events:auto; }

    .app-main{ padding:20px 16px 32px; }

    .kpi-grid{ grid-template-columns:repeat(2,1fr); }
  }

    .brand-wordmark{ font-size:13px; }

    .toolbar > *{ width:100% !important; max-width:none !important; }
    .toolbar-spacer{ display:none; }

  }

    return Promise.race([
      import(/* @vite-ignore */ url),
      new Promise(function(_, reject){ setTimeout(function(){ reject(new Error('timeout: ' + url)); }, ms); })
    ]);
  }

      status.heroui = true;
    } catch (e) {
      console.error('[heroui] failed to load @heroui/react from esm.sh', e);

    }

    window.tailwind = { config: { darkMode: 'class', theme: heroTheme, plugins: plugins } };
    window.__HEROUI_KIT_STATUS__ = status;

    // 5) Inject Tailwind Play CDN now that window.tailwind is ready — it
    // scans the DOM (and keeps watching via MutationObserver) as soon as
    // it loads, so mounting React only after this resolves guarantees the
    // very first paint already has correct utility CSS.
    await new Promise(function(resolve){
      var s = document.createElement('script');
      s.src = 'https://cdn.tailwindcss.com';
      s.onload = resolve;
      s.onerror = resolve; // never hang the boot sequence on this
      document.head.appendChild(s);
    });

    // 6) Compile the JSX app source and run it.
    try {
      var src = document.getElementById('app-src').textContent;
      var compiled = Babel.transform(src, { presets: ['react'], filename: 'heroui-app.jsx' }).code;
      var tag = document.createElement('script');
      tag.textContent = compiled;
      document.body.appendChild(tag);
    } catch (e) {
      console.error('[app] failed to compile/mount the HeroUI demo', e);
      document.getElementById('root').innerHTML =
        '<div class="boot-error"><div class="t">Не удалось скомпилировать/запустить демо</div>' +
        '<div class="d">Подробности — в консоли браузера (F12).</div></div>';
    }
  })();
</script>

</body>
</html>
