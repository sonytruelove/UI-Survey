    --vkui--color_icon_accent_themed: var(--accent);
    --vkui--color_stroke_accent: var(--accent);
    --vkui--color_stroke_accent--hover: var(--accent-hover);
  }

    font-family:'Inter', sans-serif;

  .app-shell{ min-height:100vh; display:flex; flex-direction:column; }

  .header-start{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .header-end{ margin-left:auto; display:flex; align-items:center; gap:10px; }

  .hamburger-btn{ display:none !important; color:#fff !important; }
  .brand-wrap{ display:flex; align-items:center; gap:10px; }
  .brand-icon{ width:32px; height:32px; color:var(--accent); flex-shrink:0; }
  .brand-wordmark{ font-family:'Rajdhani',sans-serif; font-weight:700; color:#fff; line-height:.95; letter-spacing:.03em; font-size:15px; text-transform:uppercase; }

  .header-search{ width:320px; max-width:34vw; }
  .header-search input{ color:#fff !important; }
  .header-icon-btn{ color:#fff !important; position:relative; }
  .header-badge{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:1.5px solid var(--bg-dark); pointer-events:none; }

  .th-actions{ text-align:right; }

  .table-footer{ display:flex; justify-content:flex-end; align-items:center; padding:14px 16px; }

  .field-block{ margin-bottom:2px; }

    display:flex; align-items:center; gap:8px; cursor:pointer;
    border:1px solid var(--border); border-radius:8px; padding:10px 14px;
    font-size:13.5px; color:var(--text-secondary); background:#fff; width:fit-content;

  /* ==================== Responsive (mobile/tablet) ====================
     VK UI's own layout primitive for this exact problem is
     SplitLayout/SplitCol (columns collapse based on real viewport width via
     AdaptivityProvider), which the app below genuinely uses for the
     sidebar/content split. Its collapsing behaviour is tuned for VK's own
     breakpoint set, not this repo's shared 960px/560px brief — so, same as
     Element Plus/Fluent UI/Shoelace/HeroUI elsewhere in this repo, the
     actual hamburger + off-canvas drawer + backdrop interaction on top of
     it is hand-rolled with plain CSS transform + React state, to keep the
     mobile UX identical across all 11 kit pages for a fair comparison. */
  @media (max-width:959px){
    .hamburger-btn{ display:inline-flex !important; }
    .header-search{ display:none; }

    .app-sider{
      position:fixed; top:64px; left:0; bottom:0; z-index:210;
      transform:translateX(-100%);
      transition:transform .22s ease;
      box-shadow:0 8px 28px rgba(0,0,0,.30);
      overflow-y:auto;
    }
    .app-sider.open{ transform:translateX(0); }

    .sider-backdrop{
      display:block; position:fixed; top:64px; left:0; right:0; bottom:0;
      background:rgba(0,0,0,.4); z-index:205;
      opacity:0; pointer-events:none; transition:opacity .18s ease;
    }
    .sider-backdrop.show{ opacity:1; pointer-events:auto; }

    .app-main{ padding:20px 16px 32px; }
    .kpi-grid{ grid-template-columns:repeat(2,1fr); }
  }

  @media (max-width:559px){
    .brand-wordmark{ font-size:13px; }
    .header-user-text{ display:none; }
    .header-new-btn .btn-text{ display:none; }
    .header-new-btn{ min-width:0 !important; padding:0 12px !important; }
    .header-search{ display:none; }

    .kpi-grid{ grid-template-columns:repeat(1,1fr); }

    .toolbar{ flex-direction:column; align-items:stretch; }
    .toolbar > *{ width:100% !important; max-width:none !important; }
    .toolbar-spacer{ display:none; }
  }

<!-- ============================================================

<script type="module">
  function importWithTimeout(url, ms){
    return Promise.race([
      import(/* @vite-ignore */ url),
      new Promise(function(_, reject){ setTimeout(function(){ reject(new Error('timeout: ' + url)); }, ms); })
    ]);

  (async function boot(){
    var VKUI = null;

      console.error('[vkui] failed to load @vkontakte/vkui from esm.sh', e);
      window.VKUI = {};

    try {

    } catch (e) {
      console.warn('[icons] @vkontakte/icons unavailable via esm.sh — using fallback glyphs for every icon', e);
      window.VKIcons = {};

        '<div class="d">Подробности — в консоли браузера (F12).</div></div>';
    }
  })();
</script>
